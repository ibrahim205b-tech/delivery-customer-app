name: wasel_customer
description: تطبيق واصل للمستهلك
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  wasel_core:
    path: ../../packages/wasel_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/home/
  # خطوط تصميم صفحات الأقسام (رخصة OFL، الملفات داخل التطبيق ولا تُحمّل من الإنترنت)
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
    - family: IBMPlexArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/full.png
  adaptive_icon_background: "#003060"
  adaptive_icon_foreground: assets/icon/foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#003060"
  image: assets/icon/splash.png
  android_12:
    color: "#003060"
    image: assets/icon/foreground.png
    icon_background_color: "#003060"
  ios: false
  web: false
