# بوابة محلية بدل Kong: نفس مسارات Supabase
events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  client_max_body_size 20m;
  server {
    listen 54321;
    location /auth/v1/     { proxy_pass http://127.0.0.1:9999/; }
    location /rest/v1/     { proxy_pass http://127.0.0.1:3000/; }
    location /storage/v1/  { proxy_pass http://127.0.0.1:5000/; proxy_set_header Host $host; }
    location /realtime/v1/ {
      proxy_pass http://127.0.0.1:4000/socket/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host realtime-dev.localhost;
      proxy_read_timeout 3600s;
    }
  }
}
