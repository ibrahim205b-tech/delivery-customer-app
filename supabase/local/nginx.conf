# بوابة محلية بدل Kong: نفس مسارات Supabase + CORS (للتجربة من المتصفح فقط)
events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  client_max_body_size 20m;
  server {
    listen 54321;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, prefer, range, accept, accept-profile, content-profile, x-upsert, x-supabase-api-version, cache-control" always;
    add_header Access-Control-Expose-Headers "content-range, x-supabase-api-version" always;
    if ($request_method = OPTIONS) { return 204; }
    location /auth/v1/     { proxy_pass http://127.0.0.1:9999/; }
    location /rest/v1/     { proxy_pass http://127.0.0.1:3000/; }
    location /storage/v1/  { proxy_pass http://127.0.0.1:5000/; proxy_set_header Host $host; }
    location /realtime/v1/ {
      proxy_pass http://127.0.0.1:4000/socket/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host realtime-dev.localhost;
      proxy_read_timeout 3600s;
    }
  }
}
