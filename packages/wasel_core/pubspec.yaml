name: wasel_core
description: نظام التصميم والنماذج وخدمات Supabase المشتركة بين تطبيقات واصل.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.18.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  http: ^1.2.0
  intl: ^0.20.2
  uuid: ^4.6.0
  connectivity_plus: ">=7.0.0 <7.3.2"
  cached_network_image: ^4.0.7
  flutter_local_notifications: ^23.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/brand/
  fonts:
    # الخط الأساسي: Alexandria (SIL OFL) — عربي + لاتيني بعائلة وحدة
    - family: Alexandria
      fonts:
        - asset: fonts/Alexandria_400Regular.ttf
          weight: 400
        - asset: fonts/Alexandria_500Medium.ttf
          weight: 500
        - asset: fonts/Alexandria_600SemiBold.ttf
          weight: 600
        - asset: fonts/Alexandria_700Bold.ttf
          weight: 700
    # احتياطي للحروف النادرة فقط
    - family: NotoSansArabic
      fonts:
        - asset: fonts/NotoSansArabic_400Regular.ttf
          weight: 400
        - asset: fonts/NotoSansArabic_700Bold.ttf
          weight: 700
